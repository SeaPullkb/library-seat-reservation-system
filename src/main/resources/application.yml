spring:
  application:
    name: library-seat-reservation-system
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:library_seat}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
app:
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  reservation-scheduler:
    enabled: true
    interval-ms: 60000
    initial-delay-ms: 60000
