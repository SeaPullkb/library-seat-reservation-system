<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body><header th:replace="~{fragments/layout :: navigation}"></header>
<main class="container py-5">
<a th:href="@{/admin}" class="small">返回管理首页</a>

<div class="my-4"><a th:href="@{/admin/users}" class="small">返回用户列表</a><h1 class="h2 mt-3 text-break">维护用户 <span th:text="${managedUser.username}"></span></h1><p class="text-secondary"><span th:text="${managedUser.roleLabel}"></span> · <span th:text="${managedUser.status == 1} ? '启用' : '禁用'"></span></p></div>
<div th:if="${notice}" th:text="${notice}" class="alert alert-success" role="status"></div><div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>
<div class="row g-4"><section class="col-lg-6"><div class="surface p-4 h-100"><h2 class="h5 mb-3">基本资料</h2><form th:action="@{/admin/users/{id}(id=${managedUser.id})}" method="post" th:object="${userEditForm}"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul class="mb-0"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="mb-3"><label for="realName" class="form-label">姓名</label><input id="realName" th:field="*{realName}" class="form-control" required maxlength="50"></div><div class="mb-3"><label for="className" class="form-label">班级（选填）</label><input id="className" th:field="*{className}" class="form-control" maxlength="100"></div><div class="mb-4"><label for="phone" class="form-label">手机号</label><input id="phone" th:field="*{phone}" class="form-control" required pattern="1[3-9][0-9]{9}" maxlength="11" inputmode="tel"></div><button class="btn btn-primary" type="submit">保存资料</button></form></div></section>
<section class="col-lg-6"><div class="surface p-4 mb-4"><h2 class="h5">角色与启用状态</h2><p class="small text-secondary">更改会使原登录会话失效。须先处理待签到、使用中预约，不自动删除或取消历史。</p><p th:if="${self}" class="small">不能修改自己的角色或禁用自己。</p><div th:unless="${self}"><form th:action="@{/admin/users/{id}/role(id=${managedUser.id})}" method="post" class="d-flex flex-wrap gap-2 align-items-end mb-3" data-confirm="确认调整角色并使该账号的原登录会话失效？"><div class="flex-grow-1"><label for="newRole" class="form-label">角色</label><select id="newRole" name="role" class="form-select"><option th:each="r : ${roles}" th:value="${r}" th:selected="${r.name() == managedUser.role}" th:text="${r.name() == 'STUDENT'} ? '学生' : (${r.name() == 'LIBRARIAN'} ? '图书馆管理员' : '超级管理员')"></option></select></div><button class="btn btn-outline-primary" type="submit">更新角色</button></form>
<form th:action="@{/admin/users/{id}/status(id=${managedUser.id})}" method="post" data-confirm="确认更改账号启用状态并使原登录会话失效？"><input type="hidden" name="enabled" th:value="${managedUser.status != 1}"><button class="btn btn-outline-secondary" type="submit" th:text="${managedUser.status == 1} ? '禁用账号' : '启用账号'"></button></form></div></div>
<div class="surface p-4"><h2 class="h5">重置密码</h2><p class="small text-secondary">新密码不会回显；重置后所有旧会话失效。重置自己需重新登录。</p><form th:action="@{/admin/users/{id}/password(id=${managedUser.id})}" method="post" data-confirm="确认重置密码并使该用户的所有旧会话失效？"><div class="mb-3"><label for="password" class="form-label">新密码（12–64字符）</label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required minlength="12" maxlength="64"></div><div class="mb-3"><label for="confirmPassword" class="form-label">再次输入新密码</label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" required minlength="12" maxlength="64"></div><button class="btn btn-outline-danger" type="submit">重置密码</button></form></div></section></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
