<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body><header th:replace="~{fragments/layout :: navigation}"></header>
<main id="main-content" tabindex="-1" class="container py-5">
<a th:href="@{/admin}" class="small">返回管理首页</a>

<p class="eyebrow mt-4">预约与签到记录</p><h1 class="h2 mb-4">预约管理</h1>
<div th:if="${notice}" th:text="${notice}" class="alert alert-success" role="status"></div><div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>
<form th:action="@{/admin/reservations}" method="get" class="surface p-4 mb-4 row g-3 mx-0">
<div class="col-sm-6 col-lg-3"><label for="keyword" class="form-label">账号或姓名</label><input id="keyword" name="keyword" th:value="${filter.keyword}" maxlength="50" class="form-control"></div>
<div class="col-sm-6 col-lg-3"><label for="roomId" class="form-label">阅览室</label><select id="roomId" name="roomId" class="form-select"><option value="">全部阅览室</option><option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name}" th:selected="${room.id == filter.roomId}"></option></select></div>
<div class="col-sm-6 col-lg-2"><label for="date" class="form-label">使用日期</label><input id="date" type="date" name="date" th:value="${filter.date}" class="form-control"></div>
<div class="col-sm-6 col-lg-2"><label for="slot" class="form-label">时段</label><select id="slot" name="slot" class="form-select"><option value="">全部时段</option><option th:each="s : ${slots}" th:value="${s.code}" th:text="${s.label}" th:selected="${s.code == filter.slot}"></option></select></div>
<div class="col-sm-6 col-lg-2"><label for="status" class="form-label">状态</label><select id="status" name="status" class="form-select"><option value="">全部状态</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == filter.status}"></option></select></div>
<div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">查询预约</button><a class="btn btn-outline-secondary" th:href="@{/admin/reservations}">重置条件</a></div>
</form>
<p class="text-secondary small">只能取消有效且未签到的预约，必须填写原因。已签到的使用记录保留；过期和完成按服务器时间显示，查询不改写历史。</p>
<div class="surface table-responsive"><table class="table align-middle mb-0"><caption class="px-3">共 <span th:text="${reservations.total}"></span> 条记录，每页20条</caption>
<thead><tr><th scope="col">学生</th><th scope="col">阅览室 / 座位</th><th scope="col">日期 / 时段</th><th scope="col">状态 / 截止</th><th scope="col">实际签到 / 签退</th><th scope="col">取消记录</th><th scope="col">操作</th></tr></thead><tbody>
<tr th:if="${reservations.records.isEmpty()}"><td colspan="7" class="text-center text-secondary py-5">暂无符合条件的预约。</td></tr>
<tr th:each="r : ${reservations.records}" th:attr="data-reservation-id=${r.id}"><th scope="row"><span th:text="${r.realName}"></span><p th:text="${r.username}" class="fw-normal small text-secondary mb-0"></p></th>
<td><span th:text="${r.roomName}"></span><p th:text="${r.seatNo}" class="small text-secondary mb-0"></p></td><td><span th:text="${r.reserveDate}"></span><p th:text="${r.slotLabel}" class="small text-secondary mb-0"></p></td>
<td><span class="badge" th:classappend="${'status-' + r.status}" th:text="${r.statusLabel}"></span><p th:text="${#temporals.format(r.checkinDeadline,'MM-dd HH:mm:ss')}" class="small text-secondary mb-0"></p></td>
<td class="small"><span th:text="${r.checkinAt == null} ? '未签到' : ${#temporals.format(r.checkinAt,'MM-dd HH:mm:ss')}"></span><p class="text-secondary mb-0" th:text="${r.checkoutAt == null} ? '—' : ${#temporals.format(r.checkoutAt,'MM-dd HH:mm:ss')}"></p></td>
<td class="small text-break"><span th:if="${r.cancelReason}" th:text="${r.cancelReason}"></span><p th:if="${r.cancelledBy}" class="text-secondary mb-0"><span th:text="${r.cancelledBy}"></span> · <span th:text="${#temporals.format(r.cancelledAt,'MM-dd HH:mm:ss')}"></span></p></td>
<td><button th:if="${r.cancellable}" class="btn btn-sm btn-outline-danger text-nowrap" type="button" data-bs-toggle="modal" th:attr="data-bs-target='#cancel-'+${r.id},aria-label='取消预约'+${r.id}">违规取消</button></td></tr></tbody></table></div>
<nav th:if="${reservations.pages > 1}" class="d-flex gap-3 align-items-center mt-4" aria-label="预约分页"><a th:if="${reservations.page > 0}" class="btn btn-sm btn-outline-secondary" th:href="@{/admin/reservations(keyword=${filter.keyword},roomId=${filter.roomId},date=${filter.date},slot=${filter.slot},status=${filter.status},page=${reservations.page-1})}">上一页</a><span>第 <span th:text="${reservations.page+1}"></span> / <span th:text="${reservations.pages}"></span> 页</span><a th:if="${reservations.hasNext()}" class="btn btn-sm btn-outline-secondary" th:href="@{/admin/reservations(keyword=${filter.keyword},roomId=${filter.roomId},date=${filter.date},slot=${filter.slot},status=${filter.status},page=${reservations.page+1})}">下一页</a></nav>
<div th:each="r : ${reservations.records}" th:if="${r.cancellable}" class="modal fade" th:id="'cancel-'+${r.id}" tabindex="-1" th:attr="aria-labelledby='cancel-title-'+${r.id}" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h2 class="modal-title fs-5" th:id="'cancel-title-'+${r.id}">违规取消预约</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
<form th:action="@{/admin/reservations/{id}/cancel(id=${r.id})}" method="post"><div class="modal-body"><p><span th:text="${r.username}"></span> · <span th:text="${r.roomName}"></span> / <span th:text="${r.seatNo}"></span> · <span th:text="${r.reserveDate}"></span></p><label th:for="'reason-'+${r.id}" class="form-label">取消原因（必填，将保留在历史中）</label><textarea th:id="'reason-'+${r.id}" name="reason" class="form-control" required maxlength="255" rows="3"></textarea></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">返回</button><button class="btn btn-danger" type="submit">确认取消预约</button></div></form>
</div></div></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
