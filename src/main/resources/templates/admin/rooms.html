<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body><header th:replace="~{fragments/layout :: navigation}"></header>
<main id="main-content" tabindex="-1" class="container py-5">
  <a th:href="@{/admin}" class="small">返回管理首页</a>
  <div class="d-flex justify-content-between align-items-center gap-3 my-4"><div><p class="eyebrow mb-2">学习空间维护</p><h1 class="h2 mb-0">阅览室管理</h1></div><button th:if="${editingId == null}" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#roomFormDialog">新增阅览室</button><a th:unless="${editingId == null}" th:href="@{/admin/rooms}" class="btn btn-outline-secondary">返回列表</a></div>
  <div th:if="${notice}" th:text="${notice}" class="alert alert-success" role="status"></div>
  <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>
  <p class="text-secondary small">停用阅览室会对学生隐藏该空间，但保留座位及预约历史；请先处理未结束的有效预约。</p>
<div class="metrics" aria-label="空间维护汇总"><section class="surface metric"><span class="metric-label">阅览室总数</span><strong class="metric-value" th:text="${spaceSummary['total']}"></strong></section><section class="surface metric"><span class="metric-label">启用阅览室</span><strong class="metric-value" th:text="${spaceSummary['enabled']}"></strong></section><section class="surface metric"><span class="metric-label">停用阅览室</span><strong class="metric-value" th:text="${spaceSummary['disabled']}"></strong></section><section class="surface metric"><span class="metric-label">启用座位总数</span><strong class="metric-value" th:text="${spaceSummary['capacity']}"></strong></section></div>
<form th:action="@{/admin/rooms}" method="get" class="surface filter-bar"><div><label for="q" class="form-label">名称或位置</label><input id="q" name="q" th:value="${q}" class="form-control" maxlength="100" placeholder="输入关键词"></div><div><label for="state" class="form-label">启用状态</label><select id="state" name="state" class="form-select"><option value="">全部状态</option><option value="1" th:selected="${state == 1}">启用</option><option value="0" th:selected="${state == 0}">停用</option></select></div><div class="filter-action d-flex gap-2"><button type="submit" class="btn btn-primary">搜索</button><a class="btn btn-outline-secondary" th:href="@{/admin/rooms}">重置</a></div></form>
  <div class="surface table-responsive">
    <table class="table align-middle mb-0"><caption class="px-3">共 <span th:text="${rooms.size()}"></span> 个匹配阅览室 / 总计 <span th:text="${spaceSummary['total']}"></span> 间，容量为座位自身启用数</caption>
      <thead><tr><th scope="col">阅览室</th><th scope="col">位置</th><th scope="col">启用座位 / 总数</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
      <tbody><tr th:if="${rooms.isEmpty()}"><td colspan="5" class="text-secondary text-center py-5">暂无匹配的阅览室；可重置筛选，或点击“新增阅览室”开始。</td></tr>
      <tr th:each="room : ${rooms}">
        <th scope="row"><span th:text="${room.name}"></span><p th:if="${room.description}" th:text="${room.description}" class="fw-normal small text-secondary mb-0"></p></th>
        <td th:text="${room.location}"></td><td><span th:text="${room.enabledSeats}"></span> / <span th:text="${room.totalSeats}"></span></td>
        <td><span class="badge" th:classappend="${room.status == 1} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${room.status == 1} ? '启用' : '停用'"></span></td>
        <td><div class="d-flex gap-2 flex-wrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rooms/{id}/seats(id=${room.id})}" th:aria-label="'管理' + ${room.name} + '的座位'">管理座位</a><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/rooms/{id}/edit(id=${room.id})}" th:aria-label="'编辑' + ${room.name}">编辑</a>
          <form th:action="@{/admin/rooms/{id}/status(id=${room.id})}" method="post" th:attr="data-confirm=${room.status == 1} ? '确认停用此阅览室？学生将无法浏览其中座位。' : null"><input type="hidden" name="enabled" th:value="${room.status != 1}"><button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${room.status == 1} ? '停用' : '启用'" th:aria-label="(${room.status == 1} ? '停用' : '启用') + ${room.name}"></button></form>
        </div></td>
      </tr></tbody>
    </table>
  </div>
  <div class="modal fade" id="roomFormDialog" tabindex="-1" aria-labelledby="roomFormTitle" aria-hidden="true" th:attr="data-auto-show=${showForm}">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 id="roomFormTitle" class="modal-title fs-5" th:text="${editingId == null} ? '新增阅览室' : '编辑阅览室'"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
      <form th:action="${editingId == null} ? @{/admin/rooms} : @{/admin/rooms/{id}(id=${editingId})}" th:object="${roomForm}" method="post">
        <div class="modal-body">
          <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
          <div class="mb-3"><label for="name" class="form-label">名称（必填）</label><input id="name" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('name')}" maxlength="100" required></div>
          <div class="mb-3"><label for="location" class="form-label">位置（必填）</label><input id="location" th:field="*{location}" class="form-control" th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('location')}" maxlength="200" required></div>
          <div><label for="description" class="form-label">介绍</label><textarea id="description" th:field="*{description}" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('description')}" maxlength="255" rows="3"></textarea></div>
        </div><div class="modal-footer"><a th:href="@{/admin/rooms}" class="btn btn-outline-secondary">取消</a><button class="btn btn-primary" type="submit">保存</button></div>
      </form>
    </div></div>
  </div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body>
</html>
