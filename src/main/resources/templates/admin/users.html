<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body><header th:replace="~{fragments/layout :: navigation}"></header>
<main id="main-content" tabindex="-1" class="container py-5">
<a th:href="@{/admin}" class="small">返回管理首页</a>

<div class="d-flex flex-wrap gap-3 justify-content-between align-items-center my-4"><div><p class="eyebrow mb-2">超级管理员</p><h1 class="h2 mb-0">用户管理</h1><p class="text-secondary mb-0 mt-2">按角色和状态检索，安全维护账号与权限。</p></div><a th:href="@{/admin/users/new}" class="btn btn-primary">新增图书馆管理员</a></div>
<div th:if="${notice}" th:text="${notice}" class="alert alert-success" role="status"></div><div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>
<form th:action="@{/admin/users}" method="get" class="surface p-4 row g-3 mx-0 mb-4">
<div class="col-sm-6 col-lg-4"><label for="keyword" class="form-label">账号或姓名</label><input id="keyword" name="keyword" th:value="${keyword}" class="form-control" maxlength="50"></div>
<div class="col-sm-6 col-lg-3"><label for="role" class="form-label">角色</label><select id="role" name="role" class="form-select"><option value="">全部角色</option><option th:each="r : ${roles}" th:value="${r}" th:text="${r.name() == 'STUDENT'} ? '学生' : (${r.name() == 'LIBRARIAN'} ? '图书馆管理员' : '超级管理员')" th:selected="${r == role}"></option></select></div>
<div class="col-sm-6 col-lg-3"><label for="status" class="form-label">状态</label><select id="status" name="status" class="form-select"><option value="">全部状态</option><option value="1" th:selected="${status == 1}">启用</option><option value="0" th:selected="${status == 0}">禁用</option></select></div><div class="col-sm-6 col-lg-2 d-flex flex-wrap align-items-end gap-2"><button class="btn btn-primary" type="submit">查询用户</button><a class="btn btn-outline-secondary ms-2" th:href="@{/admin/users}">重置</a></div></form>
<div class="panel-heading"><h2>用户列表 · <span th:text="${users.total}"></span> 人</h2><span class="small text-secondary">匹配当前筛选条件</span></div>
<p class="text-secondary small">禁用或调整角色前须处理待签到、使用中预约；账号及预约历史保留。不能禁用自己或修改自己的角色。</p>
<div class="surface table-responsive"><table class="table align-middle mb-0"><caption class="px-3">共 <span th:text="${users.total}"></span> 个用户，每页20条</caption><thead><tr><th scope="col">账号 / 姓名</th><th scope="col">班级</th><th scope="col">手机号</th><th scope="col">角色</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody><tr th:if="${users.records.isEmpty()}"><td colspan="6" class="text-center text-secondary py-5">暂无符合条件的用户。<a th:href="@{/admin/users}" class="d-block mt-2">清除筛选条件</a></td></tr><tr th:each="u : ${users.records}"><th scope="row"><span th:text="${u.username}"></span><p th:text="${u.realName}" class="fw-normal small text-secondary mb-0"></p></th><td th:text="${u.className}"></td><td th:text="${u.phone}"></td><td><span class="badge text-bg-info" th:text="${u.roleLabel}"></span></td><td><span class="badge" th:classappend="${u.status == 1} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.status == 1} ? '启用' : '禁用'"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}(id=${u.id})}" th:aria-label="'维护用户'+${u.username}">维护用户</a></td></tr></tbody></table></div>
<nav th:if="${users.pages > 1}" class="d-flex gap-3 align-items-center mt-4" aria-label="用户分页"><a th:if="${users.page > 0}" class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users(keyword=${keyword},role=${role},status=${status},page=${users.page-1})}">上一页</a><span>第 <span th:text="${users.page+1}"></span> / <span th:text="${users.pages}"></span> 页</span><a th:if="${users.hasNext()}" class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users(keyword=${keyword},role=${role},status=${status},page=${users.page+1})}">下一页</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
