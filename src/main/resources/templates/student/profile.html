<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body><header th:replace="~{fragments/layout :: navigation}"></header>
<main id="main-content" tabindex="-1" class="container py-5">
<a th:href="@{/student}" class="small">返回学生首页</a><p class="eyebrow mt-4">我的账号</p><h1 class="h2 mb-4">个人中心</h1>
<div th:if="${notice}" th:text="${notice}" class="alert alert-success" role="status"></div><div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>
<div class="row g-4"><section class="col-lg-6"><div class="surface p-4 h-100"><h2 class="h5">个人资料</h2><p class="text-secondary text-break">账号：<span th:text="${profile.username}"></span>（不可修改）</p>
<form th:action="@{/student/profile}" th:object="${studentProfileForm}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul class="mb-0"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<div class="mb-3"><label for="realName" class="form-label">姓名</label><input id="realName" th:field="*{realName}" class="form-control" autocomplete="name" required maxlength="50"></div><div class="mb-3"><label for="className" class="form-label">班级</label><input id="className" th:field="*{className}" class="form-control" required maxlength="100"></div><div class="mb-4"><label for="phone" class="form-label">手机号</label><input id="phone" th:field="*{phone}" class="form-control" type="tel" autocomplete="tel" required maxlength="11" pattern="1[3-9][0-9]{9}"></div><button class="btn btn-primary" type="submit">保存个人资料</button></form></div></section>
<section class="col-lg-6"><div class="surface p-4"><h2 class="h5">修改密码</h2><p class="text-secondary small">需验证当前密码。新密码8–64字符，UTF-8不超过72字节。成功后所有旧会话失效，请重新登录；密码不会回显。</p>
<form th:action="@{/student/profile/password}" method="post" data-confirm="确认修改密码并退出所有旧登录会话？"><div class="mb-3"><label for="currentPassword" class="form-label">当前密码</label><input id="currentPassword" name="currentPassword" type="password" class="form-control" autocomplete="current-password" required maxlength="64"></div><div class="mb-3"><label for="password" class="form-label">新密码</label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required minlength="8" maxlength="64"></div><div class="mb-4"><label for="confirmPassword" class="form-label">确认新密码</label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" required minlength="8" maxlength="64"></div><button class="btn btn-outline-primary" type="submit">修改密码并重新登录</button></form></div></section></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
