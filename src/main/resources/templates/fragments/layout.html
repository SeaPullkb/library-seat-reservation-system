<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' · 图书馆座位预约'">图书馆座位预约</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header th:fragment="navigation" class="site-header">
  <a href="#main-content" class="skip-link">跳至主要内容</a>
  <nav class="container d-flex align-items-center justify-content-between py-3" aria-label="主导航">
    <a class="brand" th:href="@{/}"><span class="brand-symbol" aria-hidden="true">阅</span>校园图书馆</a>
    <div class="d-flex align-items-center gap-3">
      <span class="small text-secondary d-none d-sm-inline">让每一次自习，都有一个好位置</span>
      <form th:if="${signedIn}" th:action="@{/logout}" method="post">
        <button class="btn btn-outline-secondary btn-sm" type="submit">退出登录</button>
      </form>
      <a th:unless="${signedIn}" th:href="@{/login}" class="btn btn-outline-primary btn-sm">登录</a>
    </div>
  </nav>
  <nav th:if="${signedIn}" class="workspace-nav container d-flex flex-wrap gap-2 pb-3 small" aria-label="功能导航">
    <a th:href="@{/}" class="nav-shortcut">首页</a>
    <th:block th:if="${studentUser}"><a th:href="@{/student/rooms}" class="nav-shortcut">阅览室与选座</a><a th:href="@{/student/reservations}" class="nav-shortcut">我的预约</a><a th:href="@{/student/profile}" class="nav-shortcut">个人中心</a></th:block>
    <th:block th:if="${adminUser}"><a th:href="@{/admin/rooms}" class="nav-shortcut">阅览室与座位</a><a th:href="@{/admin/reservations}" class="nav-shortcut">预约管理</a><a th:href="@{/admin/statistics}" class="nav-shortcut">数据统计</a></th:block>
    <a th:if="${superAdminUser}" th:href="@{/admin/users}" class="nav-shortcut">用户管理</a>
  </nav>
  <div th:if="${demoEnvironment}" class="demo-banner"><div class="container">毕业答辩演示 · 独立样本数据 · 业务时间 <span th:text="${#temporals.format(businessNow,'yyyy-MM-dd HH:mm:ss')}"></span>（固定）</div></div>
</header>
<footer th:fragment="footer" class="container py-4 text-secondary small border-top mt-5">
  高校图书馆座位预约与签到管理系统 · V1.1
</footer>
</body>
</html>
